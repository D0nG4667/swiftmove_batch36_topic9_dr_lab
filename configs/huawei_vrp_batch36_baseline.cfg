! ============================================================================
! SwiftMove Nigeria Ltd - MIT 8105 Batch 36, Topic 9 (DR Connectivity Design)
! Synchronised with Batch 36 10.20.0.0/20 VLSM & Dual-Hub Baseline
! ============================================================================

! ----------------------------------------------------------------------------
! DEVICE 1: DEPOT-LOS1-GW1 (Primary Metro Fibre Router - 10.20.9.2/28)
! ----------------------------------------------------------------------------
system-view
sysname DEPOT-LOS1-GW1
vlan batch 90
bfd

nqa test-instance admin hq-sla
 test-type icmp
 destination-address ipv4 10.20.10.1
 frequency 2
 probe-count 3
 threshold rtt 150
 start now

bfd fibre-link bind peer-ip 10.20.11.1 interface GigabitEthernet0/0/1
 discriminator local 101
 discriminator remote 201
 min-tx-interval 100
 min-rx-interval 100
 detect-multiplier 3
 commit

interface Vlanif90
 description Lagos-Depot-1-Edge-LAN
 ip address 10.20.9.2 255.255.255.240
 vrrp vrid 10 virtual-ip 10.20.9.1
 vrrp vrid 10 priority 120
 vrrp vrid 10 preempt-mode timer delay 180
 vrrp vrid 10 track bfd-session 101 reduced 50
 vrrp vrid 10 track nqa admin hq-sla reduced 50

interface GigabitEthernet0/0/1
 description Primary-Metro-Fibre-WAN
 ip address 10.20.11.2 255.255.255.252
 qos lr pct 90

bgp 65011
 router-id 10.20.9.2
 timer keepalive 10 hold 30
 peer 10.20.10.1 as-number 65001
 peer 10.20.10.2 as-number 65002
 ipv4-family unicast
  network 10.20.6.0 255.255.255.192
  network 10.20.9.0 255.255.255.240
return

! ----------------------------------------------------------------------------
! DEVICE 2: DEPOT-LOS1-GW2 (Secondary 5G n78 FWA + Tertiary LEO VSAT Router)
! ----------------------------------------------------------------------------
system-view
sysname DEPOT-LOS1-GW2
vlan batch 90

! Wireless NQA Probe (BFD disabled on cellular/VSAT to avoid false radio flaps)
nqa test-instance admin fwa-5g-sla
 test-type icmp
 destination-address ipv4 10.20.10.1
 source-address ipv4 10.20.11.6
 frequency 2
 probe-count 3
 threshold rtt 150
 start now

! Batch 36 Least-Privilege Drone & Depot ACL (Matches hq-fw-01 & dr-fw-01)
acl number 3104
 rule 5 permit tcp source 10.20.5.0 0.0.0.127 destination 10.20.4.10 0 destination-port eq 8883
 rule 10 permit udp source 10.20.5.0 0.0.0.127 destination 10.20.5.192 0.0.0.31 destination-port eq 14550
 rule 15 deny udp destination-port eq 554
 rule 20 deny udp destination-port eq 8554
 rule 25 deny tcp destination-port eq 1935
 rule 30 deny udp destination-port eq 5004

! QoS Policy: 5% CS6 Control, 20% Strict-Priority EF Cap (128 kbps per device)
traffic classifier TC-EF operator or
 if-match dscp ef
traffic behavior TB-EF
 queue ef bandwidth pct 20
 car cir 128
traffic policy TP-WAN-OUT
 classifier TC-EF behavior TB-EF

interface Vlanif90
 ip address 10.20.9.3 255.255.255.240
 traffic-filter inbound acl 3104
 vrrp vrid 10 virtual-ip 10.20.9.1
 vrrp vrid 10 priority 100

interface GigabitEthernet0/0/1
 description Secondary-5G-n78-FWA-Shaped-9Mbps
 ip address 10.20.11.6 255.255.255.252
 qos lr cir 9000
 traffic-policy TP-WAN-OUT outbound

interface GigabitEthernet0/0/2
 description Tertiary-LEO-VSAT-Lagos-PoP-Shaped-1.8Mbps
 ip address 10.20.11.10 255.255.255.252
 qos lr cir 1800
 traffic-policy TP-WAN-OUT outbound
return
